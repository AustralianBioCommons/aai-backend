[project]
name = "aai-backend"
version = "1.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.0",
    # Security floor for CVE-2026-26007 (subgroup validation for SECT curves)
    "cryptography>=49.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "email-validator~=2.3",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlmodel>=0.0.39",
    "boto3>=1.43.45",
    "authlib>=1.6.11",
    "itsdangerous>=2.2.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "apscheduler[redis,sqlalchemy]~=3.11",
    "loguru>=0.7.3",
    "cachetools~=7.1",
    "typer>=0.26.8",
    "starlette-admin>=0.16.1",
    # Security floor for CVE-2026-27199 (safe_join Windows device names)
    "werkzeug>=3.1.8",
    # Security floor for CVE-2026-40347 / CVE-2026-42561 (multipart DoS) and
    # CVE-2026-53537 / CVE-2026-53538 (Content-Disposition/querystring parameter smuggling)
    "python-multipart>=0.0.30",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs>=1.43.45",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "pytest-asyncio~=1.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.4",
    "polyfactory>=2.21.0",
    "pre-commit>=3.7.0",
    "freezegun>=1.5.2",
    "respx>=0.22.0",
    "mimesis~=18.0",
    "moto>=5.0.5",
    "faker>=40.4.0",
]

[tool.uv]
# Exclude packages newer than 7 days - may help
# prevent security issues, since hijacked packages are generally
# fixed quickly
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=auth --cov=routers --cov=schemas --cov=db --cov=biocommons --cov=scheduled_tasks --cov-report=term --cov-report=xml"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 88
target-version = "py313"
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]
exclude = ["tests/data", ".venv", "venv", "migrations"]
